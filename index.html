<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yara Hani | Full Stack Developer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">Yara Hub<span>.</span></div>
        <ul id="navLinks">
            <li><a href="#home" class="active">Home</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#comments">Comments</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <button id="menuBtn">☰</button>
        <a href="#contact" class="hire-btn">Hire Me</a>
    </nav>

    <!-- HOME SECTION -->
    <section id="home">
        <div class="hero-content">
            <h1>Hi, I'm Yara Hani</h1>
            <p>Full Stack Developer</p>
        </div>
    </section>

    <!-- SKILLS SECTION -->
    <section id="skills">
        <h2>Skills</h2>
        <div class="skills-container">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>React</span>
            <span>Node.js</span>
            <span>Firebase</span>
        </div>
    </section>

    <!-- PROJECTS SECTION -->
    <section id="projects">
        <h2>Projects</h2>
        <div class="projects-grid">
            <div class="project-card">
                <h3>Project One</h3>
                <button class="project-like" data-id="project1">❤️ <span class="project-likes">0</span> Likes</button>
                <button onclick="openVideo('https://www.w3schools.com/html/mov_bbb.mp4')">Watch Video</button>
            </div>
        </div>
    </section>

    <!-- COMMENTS SECTION -->
    <section id="comments">
        <h2>Comments</h2>
        <form id="commentForm">
            <input type="text" id="commentName" placeholder="Your Name" required>
            <textarea id="commentMessage" placeholder="Write a comment..." required></textarea>
            <button type="submit">Post Comment</button>
        </form>
        <div id="commentsContainer">
            <!-- Comments will load here -->
        </div>
    </section>

    <!-- CONTACT SECTION -->
    <section id="contact">
        <h2>Contact</h2>
        <p>Get in touch with me!</p>
    </section>

    <!-- VIDEO MODAL -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeVideo()">&times;</span>
            <video id="videoPlayer" controls></video>
        </div>
    </div>

    <!-- MAIN SCRIPT WITH VERSION QUERY TO BYPASS CACHE -->
    <script type="module" src="./main.js?v=3.0"></script>
</body>
</html>
